<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalid Akmel | Nutrition & Fitness Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .macro-bar { transition: width 0.8s ease-in-out; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        
        /* Language Toggle Display Rules */
        body.lang-en .am-only { display: none !important; }
        body.lang-am .en-only { display: none !important; }
    </style>
</head>
<body class="lang-en text-slate-50 font-sans min-h-screen flex flex-col items-center justify-start p-4 relative bg-[#0B132B] selection:bg-orange-500 selection:text-slate-950" onload="initCalculator()">

    <!-- Main Container -->
    <div class="relative z-10 max-w-2xl w-full my-4">

        <!-- 1. LANGUAGE TOGGLE HEADER -->
        <div class="flex justify-between items-center mb-6 bg-slate-900/80 p-2.5 rounded-2xl border border-slate-700/80 backdrop-blur-md">
            <span class="text-xs font-black tracking-widest text-orange-400 uppercase px-2">KALID AKMEL</span>
            <div class="bg-slate-800 p-1 rounded-xl border border-slate-700 flex text-xs font-bold">
                <button id="lang-btn-en" onclick="setLanguage('en')" class="px-3.5 py-1.5 rounded-lg bg-orange-500 text-slate-950 transition font-bold shadow-sm">English</button>
                <button id="lang-btn-am" onclick="setLanguage('am')" class="px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-white transition font-medium">አማርኛ</button>
            </div>
        </div>

        <!-- 2. HERO & COACH PROFILE HEADER -->
        <div class="bg-slate-800/90 backdrop-blur-md rounded-2xl border border-slate-700 p-6 mb-6 shadow-xl relative overflow-hidden">
            <div class="flex flex-col sm:flex-row items-center gap-5">
                
                <!-- Kalid Profile Image (Fresh Path:profile.jpg) -->
                <div class="relative w-24 h-24 sm:w-28 sm:h-28 rounded-2xl overflow-hidden border-2 border-orange-500 shadow-lg shrink-0 bg-slate-900 flex items-center justify-center text-center">
                    <img src="profile.jpg" alt="Kalid Akmel" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/150/0f172a/f97316?text=Kalid+Akmel';">
                </div>

                <!-- Header Info -->
                <div class="text-center sm:text-left">
